<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle - Farmácia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        .form-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #2c3e50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #34495e;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4e6985;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Controle de Estoque - Farmácia</h1>
        
        <div class="form-card">
            <h2>Cadastrar Novo Medicamento</h2>
            <form action="/adicionar" method="POST">
                <div class="form-group">
                    <label>Código de Barras:</label>
                    <input type="text" name="codigo_barras" required>
                </div>
                <div class="form-group">
                    <label>Nome do Medicamento:</label>
                    <input type="text" name="nome" required>
                </div>
                <div class="form-group">
                    <label>Lote:</label>
                    <input type="text" name="lote" required>
                </div>
                <div class="form-group">
                    <label>Quantidade Atual:</label>
                    <input type="number" name="quantidade_atual" required>
                </div>
                <div class="form-group">
                    <label>Validade:</label>
                    <input type="date" name="validade" required>
                </div>
                <div class="form-group">
                    <label>Laboratório:</label>
                    <input type="text" name="laboratorio">
                </div>
                <button type="submit">Salvar Medicamento</button>
            </form>
        </div>

        <h2>Lista de Estoque</h2>
        <table>
            <thead>
                <tr>
                    <th>Medicamento</th>
                    <th>Lote</th>
                    <th>Quantidade</th>
                    <th>Validade</th>
                </tr>
            </thead>
            <tbody>
                {% for med in lista_medicamentos %}
                <tr>
                    <td>{{ med[0] }}</td>
                    <td>{{ med[1] }}</td>
                    <td>{{ med[2] }}</td>
                    <td>{{ med[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
